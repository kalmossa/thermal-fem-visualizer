name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Suite de tests
        run: python -m pytest -q --durations=10

      # Les figures et le jeu de repli sont régénérés depuis le solveur : si un
      # de ces scripts casse, le dépôt publie des visuels périmés sans que rien
      # ne le signale.
      - name: Générateurs reproductibles
        run: |
          python tools/make_figures.py
          python tools/make_offline_data.py
          python fem_ballast_beton.py

      - name: Vérifier que rien n'a dérivé
        run: |
          git diff --stat
          git diff --quiet || (echo "::error::des artefacts régénérés diffèrent de ceux du dépôt — relance les scripts de tools/ et commite" && exit 1)
